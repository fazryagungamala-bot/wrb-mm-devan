<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS System - Kasir Modern</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4f46e5; /* Indigo */
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --panel-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; }
    
    /* Layout Utama */
    .pos-layout { display: grid; grid-template-columns: 80px 1fr 380px; height: 100vh; }

    /* 1. Sidebar Navigasi */
    .sidebar { background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 24px 0; gap: 30px; }
    .logo-icon { background: var(--primary); color: white; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
    .nav-btn { width: 50px; height: 50px; border-radius: 12px; border: none; background: transparent; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .nav-btn:hover { background: var(--bg-color); color: var(--primary); }
    .nav-btn.active { background: #e0e7ff; color: var(--primary); }
    .nav-btn svg { width: 24px; height: 24px; fill: currentColor; }

    /* 2. Area Konten Utama */
    .main-content { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
    
    header { display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 24px; font-weight: 700; }
    .search-box { background: var(--panel-bg); display: flex; align-items: center; padding: 10px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); width: 300px; }
    .search-box input { border: none; outline: none; width: 100%; margin-left: 10px; font-family: inherit; font-size: 14px;}
    
    .categories { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 5px; }
    .cat-btn { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 500; font-family: inherit; transition: 0.2s; color: var(--text-muted); }
    .cat-btn:hover { border-color: var(--primary); color: var(--primary); }
    .cat-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .product-card { background: var(--panel-bg); padding: 12px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); cursor: pointer; transition: all 0.25s ease; display: flex; flex-direction: column; gap: 12px; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -8px rgba(0,0,0,0.1); border-color: var(--primary); }
    .product-card:active { transform: scale(0.98); }
    .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; background: var(--bg-color); }
    .product-info h3 { font-size: 15px; margin: 0 0 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-info p.stock { font-size: 12px; color: var(--text-muted); margin: 0; }
    .product-info p.price { font-size: 16px; font-weight: 700; color: var(--primary); margin: 6px 0 0; }

    /* 3. Panel Keranjang Kasir */
    .cart-panel { background: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100vh; box-shadow: -4px 0 15px rgba(0,0,0,0.02); }
    
    .cart-header { padding: 24px; border-bottom: 1px solid var(--border-color); }
    .cart-header h2 { font-size: 20px; margin-bottom: 15px; }
    .customer-input { display: flex; gap: 10px; }
    .customer-input input { flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-family: inherit; outline: none; }
    .customer-input input:focus { border-color: var(--primary); }

    .cart-items { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .empty-cart { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 14px; }
    
    .cart-item { display: flex; align-items: center; gap: 15px; }
    .cart-item-img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; background: var(--bg-color); }
    .cart-item-details { flex: 1; }
    .cart-item-details h4 { font-size: 14px; margin: 0 0 4px; }
    .cart-item-details p { font-size: 14px; font-weight: 600; color: var(--primary); margin: 0; }
    
    .qty-control { display: flex; align-items: center; gap: 12px; background: var(--bg-color); padding: 4px; border-radius: 8px; }
    .qty-btn { background: var(--panel-bg); border: none; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-weight: bold; color: var(--text-main); display: flex; justify-content: center; align-items: center; }
    .qty-btn:active { background: #e5e7eb; }

    .cart-summary { padding: 24px; border-top: 1px solid var(--border-color); background: #fafafa; }
    .summary-line { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; color: var(--text-muted); }
    .summary-total { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px dashed #cbd5e1; font-size: 20px; font-weight: 700; color: var(--text-main); }
    
    .checkout-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: 0.2s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
    .checkout-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
    .checkout-btn:disabled { background: #9ca3af; cursor: not-allowed; box-shadow: none; transform: none; }

    /* Responsive */
    @media (max-width: 1024px) {
      .pos-layout { grid-template-columns: 80px 1fr; }
      .cart-panel { position: fixed; right: -400px; width: 380px; z-index: 100; transition: 0.3s; }
      /* Tambahkan tombol toggle cart untuk versi tablet/mobile di implementasi aslinya */
    }
  </style>
</head>
<body>

  <div class="pos-layout">
    
    <!-- SIDEBAR KIRI -->
    <aside class="sidebar">
      <div class="logo-icon">W</div>
      
      <button class="nav-btn active" title="Menu Kasir">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      </button>
      <button class="nav-btn" title="Riwayat Transaksi">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      </button>
      <button class="nav-btn" title="Pengaturan">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.73 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </aside>

    <!-- KONTEN UTAMA (Katalog Produk) -->
    <main class="main-content">
      <header>
        <div>
          <h1>Devan Mart</h1>
          <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Pilih menu untuk pesanan pelanggan</p>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--text-muted)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" placeholder="Cari nama barang...">
        </div>
      </header>

      <div class="categories">
        <button class="cat-btn active">Semua</button>
        <button class="cat-btn">Minuman Dingin</button>
        <button class="cat-btn">Kopi</button>
        <button class="cat-btn">Camilan</button>
        <button class="cat-btn">Kebutuhan Pokok</button>
      </div>

      <div class="product-grid" id="productGrid">
        <!-- Render Javascript di sini -->
      </div>
    </main>

    <!-- PANEL KANAN (Keranjang/Cart) -->
    <aside class="cart-panel">
      <div class="cart-header">
        <h2>Pesanan Saat Ini</h2>
        <div class="customer-input">
          <input type="text" id="custName" placeholder="Nama Pelanggan (Opsional)">
        </div>
      </div>

      <div class="cart-items" id="cartContainer">
        <!-- Render Javascript di sini -->
        <div class="empty-cart">Keranjang masih kosong.<br>Klik produk untuk menambah pesanan.</div>
      </div>

      <div class="cart-summary">
        <div class="summary-line">
          <span>Subtotal</span>
          <span id="subtotalDisplay">Rp 0</span>
        </div>
        <div class="summary-line">
          <span>Pajak / Layanan</span>
          <span>Rp 0</span>
        </div>
        <div class="summary-total">
          <span>Total</span>
          <span id="totalDisplay">Rp 0</span>
        </div>
        <button class="checkout-btn" id="btnCheckout" disabled>
          Proses Pembayaran
        </button>
      </div>
    </aside>

  </div>

  <script>
    // --- Data Dummy (Bisa diganti dengan data dari Supabase nanti) ---
    const dummyProducts = [
      { id: 1, name: "Kopi Susu Gula Aren", price: 15000, stock: 20, img: "https://images.unsplash.com/photo-1593443320739-77f74939d0da?w=300&q=80" },
      { id: 2, name: "Matcha Latte Ice", price: 18000, stock: 15, img: "https://images.unsplash.com/photo-1515823662972-da6a2e4d3002?w=300&q=80" },
      { id: 3, name: "Indomie Goreng Jumbo", price: 5000, stock: 45, img: "https://images.unsplash.com/photo-1612929633738-8fe01f7c8166?w=300&q=80" },
      { id: 4, name: "Keripik Kentang Original", price: 12000, stock: 10, img: "https://images.unsplash.com/photo-1566478989037-e124c68ed1ce?w=300&q=80" },
      { id: 5, name: "Roti Bakar Coklat Keju", price: 14000, stock: 8, img: "https://images.unsplash.com/photo-1525351484163-c5290fd85694?w=300&q=80" },
      { id: 6, name: "Air Mineral 600ml", price: 3000, stock: 100, img: "https://images.unsplash.com/photo-1548839140-29a749e1bc4c?w=300&q=80" }
    ];

    let cart = {}; // Format: { "id_produk": jumlah }

    const formatRupiah = (number) => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(number);

    // 1. Fungsi Render Katalog
    function renderProducts() {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = dummyProducts.map(p => `
        <div class="product-card" onclick="addToCart(${p.id})">
          <img src="${p.img}" alt="${p.name}" class="product-img">
          <div class="product-info">
            <h3>${p.name}</h3>
            <p class="stock">Stok: ${p.stock}</p>
            <p class="price">${formatRupiah(p.price)}</p>
          </div>
        </div>
      `).join('');
    }

    // 2. Fungsi Logika Keranjang (Tambah, Kurang)
    window.addToCart = function(id) {
      const product = dummyProducts.find(p => p.id === id);
      if (!product) return;
      if ((cart[id] || 0) >= product.stock) {
        alert("Jumlah melebihi stok yang tersedia!"); return;
      }
      cart[id] = (cart[id] || 0) + 1;
      updateCartUI();
    };

    window.updateQty = function(id, delta) {
      if (!cart[id]) return;
      const newQty = cart[id] + delta;
      const product = dummyProducts.find(p => p.id === id);
      
      if (newQty <= 0) {
        delete cart[id];
      } else if (newQty > product.stock) {
        alert("Stok tidak mencukupi!");
      } else {
        cart[id] = newQty;
      }
      updateCartUI();
    };

    // 3. Fungsi Render Keranjang & Kalkulasi Total
    function updateCartUI() {
      const cartContainer = document.getElementById("cartContainer");
      const btnCheckout = document.getElementById("btnCheckout");
      const itemKeys = Object.keys(cart);
      
      if (itemKeys.length === 0) {
        cartContainer.innerHTML = `<div class="empty-cart">Keranjang masih kosong.<br>Klik produk untuk menambah pesanan.</div>`;
        document.getElementById("subtotalDisplay").textContent = "Rp 0";
        document.getElementById("totalDisplay").textContent = "Rp 0";
        btnCheckout.disabled = true;
        return;
      }

      let total = 0;
      cartContainer.innerHTML = itemKeys.map(id => {
        const product = dummyProducts.find(p => p.id == id);
        const qty = cart[id];
        const sub = product.price * qty;
        total += sub;
        
        return `
          <div class="cart-item">
            <img src="${product.img}" class="cart-item-img">
            <div class="cart-item-details">
              <h4>${product.name}</h4>
              <p>${formatRupiah(product.price)}</p>
            </div>
            <div class="qty-control">
              <button class="qty-btn" onclick="updateQty(${id}, -1)">-</button>
              <span style="width:20px; text-align:center; font-size:14px; font-weight:600;">${qty}</span>
              <button class="qty-btn" onclick="updateQty(${id}, 1)">+</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById("subtotalDisplay").textContent = formatRupiah(total);
      document.getElementById("totalDisplay").textContent = formatRupiah(total);
      btnCheckout.disabled = false;
    }

    // Inisialisasi awal
    renderProducts();

  </script>
</body>
</html>
